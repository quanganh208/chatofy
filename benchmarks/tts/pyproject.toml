[project]
name = "tts-bench"
version = "0.1.0"
description = "TTS EN CPU benchmark harness: Kokoro-82M vs Piper via sherpa-onnx"
# 3.11.4+ needed for tarfile extraction filter="data"
requires-python = ">=3.11.4,<3.12"
dependencies = [
    "sherpa-onnx>=1.13.4",
    "onnxruntime>=1.27.0",
    "soundfile>=0.12",
    "numpy>=1.26",
    "psutil>=5.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tts_bench"]
