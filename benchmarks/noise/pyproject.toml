[project]
name = "noise-bench"
version = "0.1.0"
description = "Noisy-WER harness: how far transcription degrades as noise rises, measured through the real STT sidecar"
# Matches stt-bench, whose metrics this reuses, so one interpreter serves both.
requires-python = ">=3.11.4,<3.12"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "requests>=2.34.2",
    # Reused, not copied: corpus_wer / corpus_cer and the shared text
    # normalization live in stt-bench, so the noisy numbers are scored the exact
    # same way as the clean STT benchmark and stay comparable with it.
    "stt-bench",
]

[dependency-groups]
dev = ["pytest>=8.0"]

# The mixing core (noise_bench.mix) depends only on numpy and is tested on its
# own; the stt-bench path dependency is pulled in only for the metrics the
# orchestrator uses, and brings the STT engines' heavier deps with it. Run the
# mix tests without syncing the whole project:
#   uv run --no-project --with numpy --with pytest python -m pytest tests/test_mix.py
[tool.uv.sources]
stt-bench = { path = "../stt", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noise_bench"]
