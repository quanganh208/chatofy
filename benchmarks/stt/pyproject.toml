[project]
name = "stt-bench"
version = "0.1.0"
description = "STT CPU benchmark harness (vi+en): sherpa-onnx vs faster-whisper vs ElevenLabs cloud"
# 3.11.4+ needed for tarfile extraction filter="data"
requires-python = ">=3.11.4,<3.12"
dependencies = [
    "jiwer>=3.0",
    "psutil>=5.9",
    "soundfile>=0.12",
    "numpy>=1.26",
    "sherpa-onnx>=1.13.4",
    "faster-whisper>=1.2.1",
    "huggingface-hub>=1.24.0",
    "requests>=2.34.2",
    "sentencepiece>=0.2.2",
    "onnxruntime>=1.27.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stt_bench"]
