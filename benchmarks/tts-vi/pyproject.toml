[project]
name = "tts-vi-bench"
version = "0.1.0"
description = "Vietnamese TTS CPU benchmark harness: ZeroTTS vs VieNeu-TTS v3 Turbo"
# 3.11.4+ matches every sibling harness; <3.12 keeps the resolver on the same
# wheel set the sidecar and benchmarks/stt were resolved against.
requires-python = ">=3.11.4,<3.12"
dependencies = [
    # Pinned exactly, not floored. The deliverable here is a set of numbers, so
    # the resolved versions ARE part of the result — a later `uv sync` that
    # moves the inference runtime underneath recorded figures is a silent
    # correctness failure, not a dependency upgrade.
    "zerotts==0.1.2",
    "vieneu==3.8.1",
    # Same exact version services/local-tts pins. Two reasons beyond matching
    # the sidecar: ORT applies graph optimization at session load, which changes
    # numerics across versions, and ZeroTTS samples INSIDE the graph — so a
    # different ORT build can change which tokens get sampled, not merely the
    # last decimal place of a latency.
    "onnxruntime==1.27.0",
    "soundfile>=0.12",
    "numpy>=1.26",
    "psutil>=5.9",
    # --- phase 4: the round-trip judges -------------------------------------
    "jiwer>=3.0",
    "faster-whisper==1.2.1",
    # sherpa-onnx links libonnxruntime by versioned symbol and its wheel does
    # not bundle the library, so these two are one ABI pair rather than two
    # independent deps — the same pairing services/local-tts records. 1.13.4
    # pairs with the onnxruntime 1.27.0 already pinned above.
    "sherpa-onnx==1.13.4",
    "huggingface-hub>=1.24.0",
    "sentencepiece>=0.2.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tts_vi_bench"]
