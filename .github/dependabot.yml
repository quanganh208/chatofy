version: 2

# Allow-list strategy: only explicitly listed packages are monitored.
# Everything else (react, react-native, expo + 20+ expo-*, @expo/*,
# @react-navigation/*, react-native-*) is ignored implicitly.
#
# Expo/RN ecosystem must be bumped via `npx expo install --check` inside
# apps/mobile to match Expo's compatibility matrix.
#
# Major bumps are allowed — review group PR carefully before merge, since
# framework majors (NestJS 12, Next 17, Prisma 7, etc.) may require code
# migration. If a group PR fails CI, close it and cherry-pick safe bumps
# via `pnpm update --filter <pkg>` locally.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    allow:
      # Framework
      - dependency-name: '@nestjs/*'
      - dependency-name: next
      - dependency-name: prisma
      - dependency-name: '@prisma/client'
      # Data / utilities / validation
      - dependency-name: zod
      - dependency-name: pino
      - dependency-name: pino-pretty
      - dependency-name: ws
      - dependency-name: '@tanstack/react-query'
      - dependency-name: zustand
      # TypeScript + types
      - dependency-name: typescript
      - dependency-name: '@types/node'
      - dependency-name: '@types/ws'
      - dependency-name: '@types/express'
      - dependency-name: '@types/jest'
      - dependency-name: '@types/supertest'
      # Tooling (root + api)
      - dependency-name: turbo
      - dependency-name: prettier
      - dependency-name: husky
      - dependency-name: lint-staged
      - dependency-name: '@commitlint/*'
      # ESLint stack. `eslint` itself is allow-listed but then fully ignored
      # below — the workspace runs two eslint majors and Dependabot cannot
      # hold that split. See the ignore block for the manual bump procedure.
      - dependency-name: eslint
      - dependency-name: '@eslint/*'
      - dependency-name: typescript-eslint
      - dependency-name: '@typescript-eslint/*'
      - dependency-name: eslint-config-prettier
      - dependency-name: eslint-plugin-prettier
      - dependency-name: eslint-plugin-unused-imports
      - dependency-name: globals
      # Test + build tools (api)
      - dependency-name: jest
      - dependency-name: ts-jest
      - dependency-name: supertest
      - dependency-name: ts-node
      - dependency-name: ts-loader
      - dependency-name: tsconfig-paths
      - dependency-name: source-map-support
    ignore:
      # tsup 8.5.1 (rollup-plugin-dts) injects a deprecated `baseUrl` that
      # TypeScript 6.0 rejects (TS5101), breaking the dts build. Hold TS on
      # the 5.x line until the build toolchain supports the 6.0 major.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # eslint is bumped by hand, never by Dependabot.
      #
      # This workspace deliberately runs two eslint majors at once: apps/mobile
      # is stuck on 9.x because eslint-config-expo pulls eslint-plugin-react and
      # eslint-plugin-import, whose newest published versions (7.37.5 and 2.32.0)
      # still cap their eslint peer at ^9 — eslint-plugin-react crashes outright
      # under 10 with `contextOrFilename.getFilename is not a function`. Every
      # other workspace runs 10.x.
      #
      # Dependabot resolves a dependency to ONE version per workspace and cannot
      # hold that split. An `update-types: [version-update:semver-major]` ignore
      # here does not preserve it either: the rule is evaluated against the 9.x
      # instance, caps the unified target at the newest 9.x, and then rewrites
      # the 10.x manifests DOWN to it. That is a silent major downgrade that CI
      # cannot catch, because eslint 9 lints these flat configs just fine.
      #
      # So ignore eslint outright and bump each line manually:
      #   pnpm --filter <pkg> up eslint@^10   # api, web, extension, realtime-client
      #   pnpm --filter mobile up eslint@^9   # until eslint-plugin-react ships 10
      # Collapse this back to a normal allow entry once mobile can reach 10.
      - dependency-name: eslint
      # Keep @types/node on the major the code actually runs on. .nvmrc and
      # CI both pin Node 24 (Active LTS) and engines allows >=22, so types
      # from a later major describe APIs that are absent at runtime — tsc
      # accepts them and every gate here stays green. Raise this together
      # with .nvmrc and NODE_VERSION, not ahead of them.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      all-updates:
        patterns: ['*']
        update-types: [major, minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
