    directory: /packages/config
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      non-major:
        update-types: [minor, patch]

  # packages/types
  - package-ecosystem: npm
    directory: /packages/types
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      non-major:
        update-types: [minor, patch]

  # packages/ai-providers
  - package-ecosystem: npm
    directory: /packages/ai-providers
