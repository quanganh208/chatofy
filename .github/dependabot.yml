version: 2

updates:
  # Single npm scan at root — dependabot reads pnpm-lock.yaml and covers
  # all workspaces (apps/* + packages/*). All updates grouped into at most
  # two PRs per week (one patch+minor bundle, one major bundle).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      patch-and-minor:
        patterns: ['*']
        update-types: [minor, patch]
      major-updates:
        patterns: ['*']
        update-types: [major]
    ignore:
      # React ecosystem — coordinated with framework upgrades, never auto
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: react-native
        update-types: [version-update:semver-major]
      # Expo ecosystem — bound to SDK cycle, coordinate via `npx expo install`
      - dependency-name: expo
        update-types: [version-update:semver-major]
      - dependency-name: 'expo-*'
        update-types: [version-update:semver-major]
      - dependency-name: '@expo/*'
      # Churny packages with breaking majors — review manually
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: zod
        update-types: [version-update:semver-major]
      - dependency-name: 'eslint'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: '@prisma/client'
        update-types: [version-update:semver-major]
      - dependency-name: prisma
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
