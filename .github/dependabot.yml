version: 2

# Allow-list strategy: only explicitly listed packages are monitored.
# Everything else (react, react-native, expo + 20+ expo-*, @expo/*,
# @react-navigation/*, react-native-*) is ignored implicitly.
#
# Expo/RN ecosystem must be bumped via `npx expo install --check` inside
# apps/mobile to match Expo's compatibility matrix.
#
# Major bumps are allowed — review group PR carefully before merge, since
# framework majors (NestJS 12, Next 17, Prisma 7, etc.) may require code
# migration. If a group PR fails CI, close it and cherry-pick safe bumps
# via `pnpm update --filter <pkg>` locally.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    allow:
      # Framework
      - dependency-name: '@nestjs/*'
      - dependency-name: next
      - dependency-name: prisma
      - dependency-name: '@prisma/client'
      # Data / utilities / validation
      - dependency-name: zod
      - dependency-name: pino
      - dependency-name: pino-pretty
      - dependency-name: ws
      - dependency-name: '@tanstack/react-query'
      - dependency-name: zustand
      # TypeScript + types
      - dependency-name: typescript
      - dependency-name: '@types/node'
      - dependency-name: '@types/ws'
      - dependency-name: '@types/express'
      - dependency-name: '@types/supertest'
      # Tooling (root + api)
      - dependency-name: turbo
      - dependency-name: prettier
      - dependency-name: husky
      - dependency-name: lint-staged
      - dependency-name: '@commitlint/*'
      # ESLint stack. Every workspace, mobile included, runs eslint 10.
      - dependency-name: eslint
      - dependency-name: '@eslint/*'
      - dependency-name: typescript-eslint
      - dependency-name: '@typescript-eslint/*'
      - dependency-name: eslint-config-prettier
      - dependency-name: eslint-plugin-prettier
      - dependency-name: eslint-plugin-unused-imports
      - dependency-name: eslint-plugin-react-hooks
      - dependency-name: '@eslint-react/*'
      - dependency-name: eslint-plugin-expo
      - dependency-name: globals
      # UI layer. Shared components live in packages/ui behind a `/react`
      # subpath and are consumed by apps/web and the extension popup. These are
      # named explicitly because this file is an allow-list: react itself stays
      # ignored (Expo's matrix owns it, see the header), but the shadcn/Radix
      # stack around it does not answer to Expo and would otherwise be monitored
      # by nothing while shipping inside an extension that holds tabCapture.
      - dependency-name: 'radix-ui'
      - dependency-name: '@radix-ui/*'
      - dependency-name: class-variance-authority
      - dependency-name: clsx
      - dependency-name: tailwind-merge
      - dependency-name: lucide-react
      - dependency-name: tailwindcss
      - dependency-name: '@tailwindcss/*'
      - dependency-name: wxt
      - dependency-name: '@wxt-dev/*'
      # Test + build tools (api). The runner is vitest, same as every other
      # workspace; @swc/core and unplugin-swc are what give it the decorator
      # metadata Nest's DI reads, so they move in step with it.
      - dependency-name: vitest
      - dependency-name: '@vitest/*'
      - dependency-name: unplugin-swc
      - dependency-name: '@swc/*'
      - dependency-name: supertest
      - dependency-name: ts-node
      - dependency-name: ts-loader
      - dependency-name: tsconfig-paths
      - dependency-name: source-map-support
    ignore:
      # `typescript` is an alias for `@typescript/typescript6`: the JS API that
      # typescript-eslint, tsup's dts step, nest build and next build load. TS 7.0
      # ships no JS API, so a major here would remove what those tools import.
      # The `tsc` binary is TS 7 through the `@typescript/native` alias, bumped by
      # hand. Lift this once typescript-eslint and tsup accept TS 7's API.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Keep @types/node on the major the code actually runs on. .nvmrc and
      # CI both pin Node 26 (Active LTS) and engines requires >=26, so types
      # from a later major describe APIs that are absent at runtime — tsc
      # accepts them and every gate here stays green. Raise this together
      # with .nvmrc and NODE_VERSION, not ahead of them.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      all-updates:
        patterns: ['*']
        update-types: [major, minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
