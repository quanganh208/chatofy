version: 2

# NPM ecosystem PAUSED during scaffold phase.
# Scaffold versions are intentionally pinned to CLI-generated defaults (Expo SDK 54,
# NestJS 11, Next.js 16, React 19). Dependabot auto-bumps create noise without value
# while there is no real code to break. Bot was also ignoring some ignore rules for
# expo/* packages (unclear glob/name matching behavior).
#
# Re-enable after MVP launch by adding back:
#   - package-ecosystem: npm
#     directory: /
#     schedule: { interval: weekly, day: monday }
#     open-pull-requests-limit: 5
#     groups:
#       patch-and-minor: { patterns: ['*'], update-types: [minor, patch] }
#     ignore: [react*, expo*, react-native*, @expo/*, typescript-major, etc.]
#
# For now, bump deps manually when needed via `pnpm update --latest` at root, or
# for Expo specifically via `npx expo install --check` inside apps/mobile.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
