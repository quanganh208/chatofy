name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (api)
        run: pnpm --filter api prisma:generate

      # Route through turbo so workspace packages are built (^build) before lint —
      # consumers resolve @chatofy/* from built dist, which is not committed.
      - name: Lint all workspaces
        run: pnpm turbo run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (api)
        run: pnpm --filter api prisma:generate

      # Route through turbo so workspace packages are built (^build) before typecheck.
      - name: Type check all workspaces
        run: pnpm turbo run typecheck

  # Lint, typecheck and build all pass on a turn-taking bug that sends one block
  # and hangs, or on a head start that is computed and then silently thrown away
  # — both have shipped from this repo. The suites below are the only gate that
  # can see either, so they run here rather than on whoever remembers.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (api)
        run: pnpm --filter api prisma:generate

      # Through turbo so workspace packages are built first: api resolves
      # @chatofy/* from dist, which is not committed.
      - name: Run test suites
        run: pnpm turbo run test

  # The api's e2e suites are NOT covered by the job above: `pnpm turbo run test`
  # reaches api's `test` script, whose jest rootDir is `src`, so nothing under
  # `test/` has ever run in CI. That is where enforcement is proved — the guard,
  # the WebSocket upgrade refusal, the envelope — so it gets its own job.
  api-e2e:
    name: API e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (api)
        run: pnpm --filter api prisma:generate

      # Workspace packages first: the suites import @chatofy/* from dist.
      - name: Build workspace packages
        run: pnpm turbo run build --filter=@chatofy/types --filter=@chatofy/api-client

      # No database: these suites override USER_REPOSITORY with an in-memory
      # implementation, so the real controller, argon2 and JWT issuance all run
      # while only the storage layer is faked.
      - name: Run api e2e suites
        run: pnpm --filter api test:e2e

  # The one suite that needs a real database. Split from the job above so the
  # fast suites are not held behind a service container, and because what this
  # proves cannot be proved without Postgres: the googleSub unique constraint
  # and real findUnique semantics are exactly what the Google linking policy
  # depends on.
  api-e2e-db:
    name: API e2e (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chatofy
          POSTGRES_PASSWORD: chatofy
          POSTGRES_DB: chatofy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://chatofy:chatofy@localhost:5432/chatofy
      AUTH_JWT_SECRET: ci-only-secret-not-used-by-any-deployment
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (api)
        run: pnpm --filter api prisma:generate

      - name: Build workspace packages
        run: pnpm turbo run build --filter=@chatofy/types --filter=@chatofy/api-client

      - name: Apply migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Run the database-backed auth suite
        run: pnpm --filter api test:e2e:db

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (api)
        run: pnpm --filter api prisma:generate

      - name: Build all workspaces (Turborepo)
        run: pnpm turbo run build

      # Guards that read a build artifact rather than source. Deliberately in
      # this job and not in Test: `test` depends on `^build` — dependencies'
      # builds, not the package's own — so `.output` does not exist there.
      - name: Verify built artifacts
        run: pnpm turbo run verify:build

  e2e:
    name: Extension e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The suite loads `.output/chrome-mv3` and does not produce it. Its own
      # staleness guard refuses to run against a bundle older than its source,
      # which is what keeps a green run from being a green run of last week's code.
      - name: Build the extension
        run: pnpm turbo run build --filter=extension

      - name: Install Chromium
        run: pnpm --filter extension exec playwright install --with-deps chromium

      # Until now this suite ran only when someone remembered to, and said so in
      # its own output. It is the only thing standing between the popup rewrite
      # and a silent regression, so "someone remembered" is not a gate.
      - name: Extension e2e
        run: pnpm --filter extension test:e2e

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The extension holds tabCapture, scripting and microphone access and runs
      # inside three third-party meeting origins. It is the highest-consequence
      # artifact here, and until now nothing in CI looked at what it pulls in.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      # A resolution failure `tsc` cannot see: apps/mobile has no build script,
      # so nothing else in CI ever runs Metro over the shared package.
      - name: One React per bundle
        run: node scripts/check-single-react.mjs
