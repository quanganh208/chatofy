packages:
  - 'apps/*'
  - 'packages/*'

# Pin the jest 30 runtime family to one version across the workspace. Without this,
# the hoisted linker can surface jest-environment-node@29 (a dangling transitive of
# the Expo/RN toolchain, which itself runs no jest) to apps/api's jest 30 runner,
# breaking every suite with `clearMocksOnScope is not a function`.
#
# Pin @types/node to the major the code actually runs on. .nvmrc and CI both
# pin Node 24, but only api, web and ai-providers declare @types/node — vitest,
# vite and @commitlint/cli take it as an optional peer, so root, ui and
# api-client would silently resolve a later major and typecheck against APIs
# absent at runtime. One version everywhere keeps that from drifting back.
#
# Everything after the pins above is a security floor rather than a compatibility
# pin, and each is an override because nothing in this repo depends on that
# package directly — `browserslist` arrives under `@nestjs/cli>webpack` and
# `jest>@babel/core`, `mysql2` under `prisma`, `multer` under
# `@nestjs/platform-express`. A floor is the only way to raise a package a hundred
# paths deep without waiting for every parent to bump. Each carries the advisory
# ids it answers, so a floor can be removed once its parents have moved.
#
# They are floors, not pins: `>=` lets the tree keep resolving forward on its own
# and only refuses to go back under the patched version.
overrides:
  jest-mock: ^30
  jest-environment-node: ^30
  '@jest/environment': ^30
  '@jest/fake-timers': ^30
  '@types/node': ^24
  # GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g — high, <=4.28.6. Build-time only.
  browserslist: '>=4.28.8'
  # GHSA-3f6p-5ww8-9rcr — high, <3.22.0: an auth-plugin downgrade that leaks
  # plaintext credentials. Unreachable here — `schema.prisma` is `postgresql`, so
  # this driver never loads — but the floor costs nothing and the gate should not
  # have to be told which of prisma's drivers we happen to use.
  mysql2: '>=3.24.2'
  # GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp — high, >=3.0.0 <3.1.6: host
  # confusion via percent-encoded scheme normalization. 44 paths deep under
  # ajv (commitlint, @nestjs/cli, prisma dev) — nothing imports it directly,
  # so a floor is the only way to raise it everywhere at once.
  # GHSA-qw65-cvwx-89v3, GHSA-58mr-gqgx-xq4g — high, <3.1.7: authority injection
  # via an unvalidated port, and host confusion via an unclosed bracket. Capped
  # below 4: every consumer is ajv, which asks for ^3, and an open floor would
  # hand it the 4.x line.
  fast-uri: '>=3.1.7 <4'
  # GHSA-w2rr-34g9-rvrj and seven siblings — high, <=0.8.14: prototype pollution
  # and several parser confusions. Transitive only, under the Expo and Prisma
  # trees; nothing here imports an XML parser directly.
  '@xmldom/xmldom': '>=0.8.15'
  # GHSA-2883-xcg3-v3hh — high. The advisory covers both live major lines, so
  # each gets its own floor and each is CAPPED. An open `>=4.3.2` is what an
  # unscoped floor looks like in practice: it resolved the v4 consumers to 5.4.1,
  # a major bump nobody asked for, to fix a patch-level advisory.
  'js-yaml@^3': '>=3.15.2 <4'
  'js-yaml@^4': '>=4.3.2 <5'
  # GHSA-535w-7cp7-47q4, GHSA-qfvm-cv95-jqjf — high, <2.3.0: denial of service
  # from an oversized array index in a multipart field name. Reached only through
  # @nestjs/platform-express, which depends on multer whether or not anything
  # uses it — and nothing here does: the api declares no FileInterceptor and no
  # multipart route, and the one upload it has (the avatar) is base64 in a JSON
  # body. So this is a floor over an unreachable parser rather than a live fix,
  # raised because the parser ships in the api image regardless and the next
  # multipart route must not silently inherit a vulnerable one.
  multer: '>=2.3.0'
  # GHSA-xwg4-73v4-xw9w — high, <3.3.12. Deep in the Expo transitive tree
  # (@react-navigation, @expo/*) under parents that pin `nanoid ^3.3.11`;
  # nothing here depends on nanoid directly, so same story as fast-uri.
  nanoid: '>=3.3.12'
  # GHSA-7w5x-hrqm-74c2 — high, <=1.7.0: denial of service via malformed TOML.
  # Reached only through knip (a devDependency that parses this repo's own
  # config, never user input), and knip's declared range already admits the
  # patch, so the floor costs nothing.
  smol-toml: '>=1.7.1'
  # GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3, GHSA-vp8m-p9jh-q5pm — high,
  # <8.10.2. Reached only through jsdom under vitest, so test-time only; jsdom
  # asks for ^8.9.0 and the patch sits inside it.
  undici: '>=8.10.2 <9'
  # GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p — high: stack exhaustion from
  # crafted brace patterns. Two live major lines under minimatch (eslint,
  # @nestjs/cli, the Expo tree), each floored and capped like js-yaml.
  'brace-expansion@^1': '>=1.1.20 <2'
  'brace-expansion@^5': '>=5.0.11 <6'
  # GHSA-w7jw-789q-3m8p (critical), GHSA-395f-4hp3-45gv (high), <=1.8.4. Under
  # react-devtools-core in the React Native dev toolchain, which asks for ^1.6.1.
  shell-quote: '>=1.9.0 <2'
  # GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849 — high, <=8.5.17. @expo/metro-config
  # pins ~8.4.32; a minor bump inside postcss 8 is the only way past it.
  postcss: '>=8.5.18 <9'
  # GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr — high, <=2.0.2, and no 1.x patch
  # exists. The only consumer is metro, whose ^1.0.2 range this overrides across
  # a major: 2.x reads buffers only, so `patches/metro@0.83.6.patch` makes metro
  # read the asset before measuring it. Drop both once Expo ships a metro that
  # no longer depends on image-size.
  image-size: '>=2.0.3 <3'
  # GHSA-ggr8-5vv4-36mx — high, <8.0.0. @prisma/config pins 7.1.5 exactly and
  # only calls `deepmerge`, whose signature 8.x keeps.
  deepmerge-ts: '>=8.0.0 <9'
# Which dependency install/build scripts pnpm may run (supply-chain policy).
# true  = native binary / engine needed at runtime; skipping breaks the app.
# false = telemetry, donation banner, or optional codegen; safe to skip.
allowBuilds:
  argon2: true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  # The api's test runner compiles through SWC rather than esbuild, because only
  # SWC emits the decorator metadata Nest's DI reads. Its postinstall picks the
  # platform binary; skip it and every api suite fails to transform.
  '@swc/core': true
  '@google/genai': false
  '@nestjs/core': false
  # Native, but the only false entry that is: jest-haste-map took a direct
  # dependency on it in jest 30.5, and its script is node-gyp-build, which
  # compiles from source ONLY when no prebuild matches. All twelve
  # `@parcel/watcher-<platform>` packages resolve as optional dependencies, so
  # the prebuilt binary is always there and the compile never has to happen.
  # It also only ever runs under jest's watch mode, which CI does not use.
  '@parcel/watcher': false
  '@scarf/scarf': false
  protobufjs: false
minimumReleaseAgeExclude:
  - playwright-core@1.62.1
  - playwright@1.62.1
  - '@google/genai@2.16.0'
  - '@vitejs/plugin-react@6.1.0'
patchedDependencies:
  metro@0.83.6: patches/metro@0.83.6.patch

# Advisories that have no patched version in existence, so no floor and no
# `--audit-level` can answer them: the newest published release is itself the
# vulnerable range. Without this list `pnpm audit --audit-level=high` fails on
# every branch, including main, and the gate stops meaning anything. Each entry
# names what would clear it — delete the entry when that happens.
#
# `pnpm audit --ignore-unfixable` would generate this list for us, but the flag
# also silences every FUTURE advisory that happens to have no patch yet, so a
# new unpatchable high would pass CI without anyone deciding. Committing the
# list keeps each suppression a reviewed line. It is not self-pruning: an entry
# whose advisory stops applying is silently kept, which is why each carries the
# condition that clears it.
auditConfig:
  ignoreGhsas:
    # GHSA-86w9-cpqp-85rv — node-forge <=1.4.0, and 1.4.0 is the newest release.
    # Reached only by apps/mobile, through @expo/cli and its
    # code-signing-certificates; the api, web and extension runtimes never load
    # it, and neither does any other workspace package. Clears when Expo ships a
    # CLI on a patched node-forge.
    - GHSA-86w9-cpqp-85rv
    # GHSA-vfj7-8cjw-p6xm — braces <=3.0.3, and 3.0.3 is the newest release.
    # Stack exhaustion from a deeply nested pattern. One direct parent,
    # micromatch@4.0.8, reached from two workspace packages: apps/mobile via
    # metro-file-map and babel-jest, and packages/config via
    # eslint-config-next's fast-glob. Both routes are build- and lint-time over
    # this repo's own file tree, never over anything a user sends. Clears when
    # micromatch moves to a patched braces.
    - GHSA-vfj7-8cjw-p6xm
