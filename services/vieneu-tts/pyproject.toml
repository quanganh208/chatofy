[project]
name = "vieneu-tts-sidecar"
version = "0.1.0"
description = "Local HTTP sidecar wrapping VieNeu-TTS for Vietnamese speech synthesis"
requires-python = ">=3.11"
dependencies = [
    "vieneu==3.1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "soundfile>=0.12",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

# Application, not a distributable package — skip build backend so `uv sync`
# only resolves dependencies into .venv.
[tool.uv]
package = false
