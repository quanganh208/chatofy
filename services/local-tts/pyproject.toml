[project]
name = "local-tts-sidecar"
version = "0.1.0"
description = "Local HTTP sidecar wrapping sherpa-onnx Kokoro for English speech synthesis"
# 3.11.4+ needed for tarfile extraction filter="data"
requires-python = ">=3.11.4,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sherpa-onnx>=1.13.4",
    "onnxruntime>=1.27.0",
    "soundfile>=0.12",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

# Application, not a distributable package — skip build backend so `uv sync`
# only resolves dependencies into .venv.
[tool.uv]
package = false
