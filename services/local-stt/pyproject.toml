[project]
name = "local-stt-sidecar"
version = "0.1.0"
description = "Local HTTP sidecar wrapping sherpa-onnx for Vietnamese + English speech-to-text"
# 3.11.4+ needed for tarfile extraction filter="data"
requires-python = ">=3.11.4,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    # sherpa-onnx links libonnxruntime by versioned symbol (VERS_1.27.0) and its
    # wheel does not bundle the library, so these two are one ABI pair, not two
    # independent deps. 1.13.5/1.13.6 need onnxruntime 1.27.1, which PyPI has
    # never published — both are unusable here. Pinned exactly so a fresh
    # resolve cannot pick a combination that fails at import.
    "sherpa-onnx==1.13.4",
    "onnxruntime==1.27.0",
    "av>=13",
    "numpy>=1.26",
    "huggingface-hub>=1.24.0",
    "sentencepiece>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

# Application, not a distributable package — skip build backend so `uv sync`
# only resolves dependencies into .venv.
[tool.uv]
package = false
