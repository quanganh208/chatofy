# Chatofy local dev stack — everything that is not a Node app runs here.
#
#   docker compose up -d --wait   # or just `pnpm dev` / `pnpm dev:all`
#   docker compose logs -f        # or `pnpm logs`
#   docker compose down           # stop;  add -v to wipe the database
#
# web and api deliberately stay on the host: they need HMR and the turbo cache,
# and a bind-mounted Next.js dev server buys nothing for either.
#
# Every port binds to 127.0.0.1, not 0.0.0.0. A dev database with the password
# `chatofy` should not be reachable from the network the laptop is on.
#
# Host ports are variables, and no service pins `container_name`, so a second
# checkout — a git worktree — can bring this stack up beside the first. Compose
# already scopes container and volume names by project, and the project defaults
# to the directory name, so a worktree gets its own set for free; the host ports
# were the only globally shared resource left. Set the three PORT variables in a
# root `.env` in that worktree, and keep apps/api/.env pointing at them.
#
# `restart: 'no'` everywhere below, deliberately. Docker restarts `always` and
# `unless-stopped` containers whenever the daemon starts, and the daemon now
# starts at boot so the production stack can heal itself — which meant this
# stack woke up next to it, holding ~2.5GB of speech weights resident for
# nobody. Stopping the containers by hand is not a fix either: `pnpm dev` runs
# `compose up -d` and would re-arm it. Dev runs when dev asks for it. The
# production compose keeps `unless-stopped`, where self-healing is the point.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatofy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatofy}
      POSTGRES_DB: ${POSTGRES_DB:-chatofy}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - chatofy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-chatofy}']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: 'no'

  # Refresh-token families. NO VOLUME here, deliberately: losing dev sessions on
  # a restart costs one re-login, and a persistent dev Redis is one more thing to
  # wipe when it goes strange. Production is the opposite — see
  # docker-compose.prod.yml, where the named volume is load-bearing.
  #
  # No password: it binds 127.0.0.1 and the compose network only, exactly like
  # the speech sidecars. Accepted trade-off — with only SHA-256 hashes stored,
  # read access is a disclosure of hashes, not of credentials. The upgrade path
  # if this is ever exposed is `redis://:password@host:port` in REDIS_URL.
  #
  # `--maxmemory` is the half that does the work. `noeviction` is already Redis's
  # own default and `maxmemory` defaults to unlimited, so the policy flag alone
  # changes nothing — Redis would simply grow until the host OOM killer picked a
  # victim. The explicit ceiling is what bounds it, and `noeviction` is what makes
  # reaching it a refusal to write (503 on refresh, 500 on login) until keys
  # expire, rather than an eviction of live session keys — an evicted family key
  # reads as a clean 401, an unexplained sign-out.
  redis:
    image: redis:8-alpine
    command:
      ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction', '--save', '']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: 'no'

  # ── Local speech sidecars ──────────────────────────────────────────────────
  # Standalone uv projects, not part of the pnpm workspace. Running them here
  # rather than on the host keeps Python and uv off the machine entirely, and
  # pins the sherpa-onnx shared-library fix into the image instead of leaving it
  # a manual step that has to be repeated every time a .venv is rebuilt.
  #
  # `models/` is bind-mounted rather than baked in: it is 1.7GB of gitignored
  # weights, and an image carrying it would be rebuilt and re-pulled for every
  # source change. The entrypoint downloads whatever is missing on first start,
  # so a fresh clone needs no separate setup step.
  local-stt:
    build: ./services/local-stt
    ports:
      - '127.0.0.1:${LOCAL_STT_PORT:-8002}:8002'
    volumes:
      - ./services/local-stt/models:/app/models
    environment:
      # Physical cores beat hyperthreads for both engines — measured, see
      # docs/development-journey.md.
      LOCAL_STT_THREADS: ${LOCAL_STT_THREADS:-8}
      # Decodes served concurrently per engine, through the one recognizer —
      # see services/local-stt/engines/base.py for the measurement.
      LOCAL_STT_CONCURRENCY: ${LOCAL_STT_CONCURRENCY:-4}
      # English finals: `parakeet` (default) or `moonshine` (rollback).
      LOCAL_STT_EN_FINAL: ${LOCAL_STT_EN_FINAL:-parakeet}
    healthcheck:
      # /healthz answers 503 until both engines AND the speaker extractor are
      # loaded, so `--wait` really does mean the sidecar can serve a request.
      # The consequence to know: missing speaker weights stop the whole sidecar,
      # not just /embed. Accepted because it fails loudly at startup, and the
      # weights are fetched by the same script as the ASR ones.
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz')",
        ]
      interval: 5s
      timeout: 5s
      # First ever start also downloads ~1.3GB of weights.
      start_period: 600s
      retries: 5
    restart: 'no'

  local-tts:
    build: ./services/local-tts
    ports:
      - '127.0.0.1:${LOCAL_TTS_PORT:-8003}:8003'
    volumes:
      - ./services/local-tts/models:/app/models
      # The Vietnamese voice comes from Hugging Face rather than a release
      # tarball, so it lands in the HF cache instead of models/. Both voices
      # load eagerly at startup, so without this volume every container recreate
      # would re-download it before the sidecar could answer anything.
      - chatofy_hf_cache:/hf-cache
    environment:
      LOCAL_TTS_THREADS: ${LOCAL_TTS_THREADS:-8}
      HF_HOME: /hf-cache
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/healthz')",
        ]
      interval: 5s
      timeout: 5s
      start_period: 600s
      retries: 5
    restart: 'no'

volumes:
  chatofy_postgres_data:
  chatofy_hf_cache:
